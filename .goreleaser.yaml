version: 2

# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
project_name: recasaos
before:
  hooks:
    - .github/scripts/check-release-policy.sh
    - go generate ./...
    - go mod verify
    - go test ./...
    - go vet ./...

builds:
  - id: casaos-amd64
    binary: build/sysroot/usr/bin/casaos
    hooks:
      post:
        - upx --best --lzma -v --no-progress "{{ .Path }}"
    env:
      - CC=x86_64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - amd64
  - id: casaos-arm64
    binary: build/sysroot/usr/bin/casaos
    # hooks:
    #   post:
    #     - upx --best --lzma -v --no-progress "{{ .Path }}"
    env:
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm64
  - id: casaos-arm-7
    binary: build/sysroot/usr/bin/casaos
    hooks:
      post:
        - upx --best --lzma -v --no-progress "{{ .Path }}"
    env:
      - CC=arm-linux-gnueabihf-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
  - id: casaos-riscv64
    binary: build/sysroot/usr/bin/casaos
    env:
      - CC=riscv64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - riscv64
  - id: recasaos-public-files-amd64
    binary: build/sysroot/usr/lib/recasaos-public-files/rootfs/usr/bin/recasaos-public-files
    main: ./cmd/recasaos-public-files
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
      - -s
      - -w
    tags:
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - amd64
  - id: recasaos-public-files-arm64
    binary: build/sysroot/usr/lib/recasaos-public-files/rootfs/usr/bin/recasaos-public-files
    main: ./cmd/recasaos-public-files
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
      - -s
      - -w
    tags:
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm64
  - id: recasaos-public-files-arm-7
    binary: build/sysroot/usr/lib/recasaos-public-files/rootfs/usr/bin/recasaos-public-files
    main: ./cmd/recasaos-public-files
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
      - -s
      - -w
    tags:
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
  - id: recasaos-public-files-riscv64
    binary: build/sysroot/usr/lib/recasaos-public-files/rootfs/usr/bin/recasaos-public-files
    main: ./cmd/recasaos-public-files
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
      - -s
      - -w
    tags:
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - riscv64
  - id: casaos-migration-tool-amd64
    binary: build/sysroot/usr/bin/casaos-migration-tool
    hooks:
      post:
        - upx --best --lzma -v --no-progress "{{ .Path }}"
    main: ./cmd/migration-tool
    env:
      - CC=x86_64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - amd64
  - id: casaos-migration-tool-arm64
    binary: build/sysroot/usr/bin/casaos-migration-tool
    # hooks:
    #   post:
    #     - upx --best --lzma -v --no-progress "{{ .Path }}"
    main: ./cmd/migration-tool
    env:
      - CC=aarch64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm64
  - id: casaos-migration-tool-arm-7
    binary: build/sysroot/usr/bin/casaos-migration-tool
    hooks:
      post:
        - upx --best --lzma -v --no-progress "{{ .Path }}"
    main: ./cmd/migration-tool
    env:
      - CC=arm-linux-gnueabihf-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - arm
    goarm:
      - "7"
  - id: casaos-migration-tool-riscv64
    binary: build/sysroot/usr/bin/casaos-migration-tool
    main: ./cmd/migration-tool
    env:
      - CC=riscv64-linux-gnu-gcc
    ldflags:
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -s
      - -w
      - -extldflags "-static"
    tags:
      - musl
      - netgo
      - osusergo
    goos:
      - linux
    goarch:
      - riscv64
archives:
  - name_template:  >- 
      {{ .Os }}-{{- if eq .Arch "arm" }}arm-7{{- else }}{{ .Arch }}{{- end }}-{{ .ProjectName }}-v{{ .Version }}
    id: casaos
    ids:
      - casaos-amd64
      - casaos-arm64
      - casaos-arm-7
      - casaos-riscv64
      - recasaos-public-files-amd64
      - recasaos-public-files-arm64
      - recasaos-public-files-arm-7
      - recasaos-public-files-riscv64
    files:
      - build/**/*
  - name_template: >-
      {{ .Os }}-{{- if eq .Arch "arm" }}arm-7{{- else }}{{ .Arch }}{{- end }}-{{ .ProjectName }}-migration-tool-v{{ .Version }}
    id: casaos-migration-tool
    ids:
      - casaos-migration-tool-amd64
      - casaos-migration-tool-arm64
      - casaos-migration-tool-arm-7
      - casaos-migration-tool-riscv64
    files:
      - build/sysroot/etc/**/*
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
release:
  # Binary releases remain disabled until the component BOM and installer are pinned.
  disable: true
  github:
    owner: EdmundFu-233
    name: ReCasaOS
  draft: true
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
