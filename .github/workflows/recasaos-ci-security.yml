name: ReCasaOS CI and security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: recasaos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-vet:
    name: Generate, test, and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Verify dependency graph is tidy
        run: go mod tidy -diff

      - name: Enforce offline release and migration policy
        run: .github/scripts/check-release-policy.sh

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Generate API clients
        run: go generate ./...

      - name: Verify generated API clients are committed
        run: git diff --exit-code -- codegen/

      - name: Run tests
        run: go test ./...

      - name: Exercise mount-boundary regressions in the ephemeral runner
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            GOTOOLCHAIN=local \
            GOCACHE=/tmp/recasaos-go-build-cache \
            go test -count=1 ./pkg/filesecurity \
              -run '^(TestManagedRootsTreeSizeRejectsNestedBindMount|TestManagedDirectoryCopyRejectsBindMountAliasIntoSource|TestManagedReplaceCleanupRejectsBindAliasAncestorOfConfiguredRoot)$'

      - name: Verify isolated Samba probe privilege boundary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            GOTOOLCHAIN=local \
            GOCACHE=/tmp/recasaos-go-build-cache \
            go test -count=1 ./pkg/samba \
              -run '^TestRealProbeSandboxDropsIdentityAndAppliesLimitsBeforeReady$'

      - name: Verify SQLite sticky-directory ownership boundary
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            GOTOOLCHAIN=local \
            GOCACHE=/tmp/recasaos-go-build-cache \
            go test -count=1 ./pkg/sqlite \
              -run '^TestPrepareSecureDatabaseDirectoryRejectsForeignOwnedChildInStickyAncestor$'

      - name: Run security-sensitive race tests
        run: go test -race ./pkg/authsecurity ./pkg/filesecurity ./pkg/httpsecurity ./pkg/netsecurity ./pkg/publicfiles ./pkg/samba ./pkg/sqlite ./pkg/utils/file ./pkg/utils/httper ./route/v1 ./service

      - name: Run vet
        run: go vet ./...

  govulncheck:
    name: Generate and scan reachable Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.5
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Generate API clients
        run: go generate ./...

      - name: Verify generated API clients are committed
        run: git diff --exit-code -- codegen/

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
