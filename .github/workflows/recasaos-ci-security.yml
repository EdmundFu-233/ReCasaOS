name: ReCasaOS CI and security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

concurrency:
  group: recasaos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-vet:
    name: Generate, test, and vet
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify dependency graph is tidy
        run: go mod tidy -diff

      - name: Verify exact Go toolchain policy
        run: .github/scripts/test-go-toolchain-version-policy.sh

      - name: Enforce offline release and migration policy
        run: .github/scripts/check-release-policy.sh

      - name: Verify trusted privileged exact-SHA policy
        run: .github/scripts/test-trusted-privileged-workflow.sh

      - name: Verify browser diagnostic retention policy
        run: bash .github/scripts/check-public-files-browser-diagnostics-policy.sh

      - name: Validate GoReleaser configuration
        run: .github/scripts/check-goreleaser-config.sh

      - name: Verify public-file service dependency boundary
        run: .github/scripts/check-public-files-service-boundary.sh

      - name: Verify public-file systemd packaging boundary
        run: deploy/systemd/check-public-files-units.sh .

      - name: Verify Debian 11 systemd 247 unit compatibility
        timeout-minutes: 5
        shell: bash
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          # This is the official Debian 11.11 image published on 2026-07-13,
          # pinned to its linux/amd64 OCI manifest. The repository is mounted
          # read-only and the container receives no host environment, devices,
          # elevated privileges, or Docker socket.
          image='debian:bullseye-20260713@sha256:e40377b87a60470bf4aa59f0598d173bfb7d705e83bb310f9b6ef4a0ed00ec21'
          docker run --rm \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --memory 1g \
            --cpus 2 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/repo,readonly" \
            --tmpfs /tmp:rw,nosuid,nodev,exec,size=64m \
            "$image" \
            /bin/bash -ceu '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update >/dev/null
              apt-get install --yes --no-install-recommends systemd >/dev/null

              set -- $(systemd-analyze --version)
              test "$1" = systemd
              test "$2" = 247

              systemd-sysusers \
                /repo/build/sysroot/usr/lib/sysusers.d/recasaos-public-files.conf
              /repo/deploy/systemd/check-public-files-units.sh /repo
              /repo/deploy/systemd/verify-public-files-units.sh \
                /repo/build/sysroot/usr/lib/systemd/system/recasaos-public-files.service \
                /repo/build/sysroot/usr/lib/systemd/system/recasaos-public-files.socket \
                /bin/true
            '

      - name: Exercise public-file unit checker negative cases
        run: .github/scripts/test-public-files-unit-checker.sh

      - name: Exercise public-file semantic verifier negative cases
        run: .github/scripts/test-public-files-semantic-verifier.sh

      - name: Exercise cgroup memory sampler negative cases
        run: .github/scripts/test-cgroup-memory-sampler.sh

      - name: Verify Debian 11 systemd VM policy
        run: .github/scripts/test-debian11-systemd-vm-policy.sh

      - name: Cross-compile isolated public-file service
        run: .github/scripts/check-public-files-builds.sh

      - name: Verify formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi

      - name: Generate API clients
        run: go generate ./...

      - name: Verify generated API clients are committed
        run: git diff --exit-code -- codegen/

      - name: Run tests
        run: go test ./...

      - name: Verify isolated Samba probe privilege boundary
        if: >-
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            (
              github.event.pull_request.author_association == 'OWNER' ||
              github.event.pull_request.author_association == 'MEMBER' ||
              github.event.pull_request.author_association == 'COLLABORATOR'
            )
          )
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            GOTOOLCHAIN=local \
            GOCACHE=/tmp/recasaos-go-build-cache \
            go test -count=1 ./pkg/samba \
              -run '^TestRealProbeSandboxDropsIdentityAndAppliesLimitsBeforeReady$'

      - name: Verify SQLite sticky-directory ownership boundary
        if: >-
          github.event_name != 'pull_request' ||
          (
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]' &&
            (
              github.event.pull_request.author_association == 'OWNER' ||
              github.event.pull_request.author_association == 'MEMBER' ||
              github.event.pull_request.author_association == 'COLLABORATOR'
            )
          )
        shell: bash
        run: |
          sudo env \
            "PATH=$PATH" \
            GOTOOLCHAIN=local \
            GOCACHE=/tmp/recasaos-go-build-cache \
            go test -count=1 ./pkg/sqlite \
              -run '^TestPrepareSecureDatabaseDirectoryRejectsForeignOwnedChildInStickyAncestor$'

      - name: Run security-sensitive race tests
        run: go test -race ./cmd/recasaos-public-files ./pkg/authsecurity ./pkg/filesecurity ./pkg/httpsecurity ./pkg/netsecurity ./pkg/publicfiles ./pkg/samba ./pkg/sqlite ./pkg/utils/file ./pkg/utils/httper ./route/v1 ./service

      - name: Run vet
        run: go vet ./...

  # This guard controls only ReCasaOS's dedicated mount mutations. Standard
  # GitHub-hosted runners themselves provide passwordless sudo, so it is not a
  # sandbox for arbitrary fork code. An untrusted PR must be reproduced at the
  # exact commit on a one-time trusted same-repository ref before the dedicated
  # exact-SHA status can be published. The default-branch trusted workflow is
  # the only supported publisher; a skipped job is never that evidence.
  privileged-mount-tests:
    name: Privileged mount regressions (isolated namespace)
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install filesystem compatibility tools
        timeout-minutes: 10
        shell: bash
        run: |
          sudo apt-get update
          # The hosted Azure kernel ships F2FS in its exact-version extras.
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
              btrfs-progs \
              e2fsprogs \
              f2fs-tools \
              kmod \
              "linux-modules-extra-$(uname -r)" \
              mount \
              udev \
              util-linux \
              xfsprogs
          for tool in losetup mkfs.btrfs mkfs.ext4 mkfs.f2fs mkfs.xfs mount udevadm umount; do
            if ! command -v "$tool" >/dev/null; then
              printf 'required privileged filesystem test tool is unavailable: %s\n' "$tool" >&2
              exit 1
            fi
          done
          for module in loop xfs btrfs f2fs; do
            sudo modprobe "$module"
          done
          if [[ ! -c /dev/loop-control ]]; then
            printf 'loop-control device is unavailable after loading the loop module\n' >&2
            exit 1
          fi

      - name: Compile privileged test binaries without root
        timeout-minutes: 5
        shell: bash
        run: |
          umask 022
          CGO_ENABLED=0 go test -c \
            -o "$RUNNER_TEMP/recasaos-filesecurity.test" \
            ./pkg/filesecurity
          CGO_ENABLED=0 go test -c \
            -o "$RUNNER_TEMP/recasaos-publicfiles.test" \
            ./pkg/publicfiles
          test -x "$RUNNER_TEMP/recasaos-filesecurity.test"
          test -x "$RUNNER_TEMP/recasaos-publicfiles.test"

      - name: Exercise management mount-boundary regressions
        timeout-minutes: 5
        shell: bash
        run: |
          sudo unshare --mount --propagation private --fork --kill-child=KILL \
            env \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              RECASAOS_PRIVILEGED_MOUNT_TEST=1 \
              "$RUNNER_TEMP/recasaos-filesecurity.test" \
                -test.count=1 \
                -test.run '^(TestManagedDirectDirectoryRenameRejectsNestedBindMount|TestManagedRemoveAllPreflightsNestedMountBeforeDeletingSibling|TestManagedRootsTreeSizeRejectsNestedBindMount|TestManagedDirectoryCopyRejectsBindMountAliasIntoSource|TestManagedRegularCopyRejectsDestinationBindAliasIntoAnotherConfiguredRoot|TestManagedReplaceCleanupRejectsBindAliasAncestorOfConfiguredRoot)$' \
                -test.timeout=4m \
                -test.v

      - name: Exercise public-root mount and filesystem regressions
        timeout-minutes: 10
        shell: bash
        run: |
          sudo unshare --mount --propagation private --fork --kill-child=KILL \
            env \
              PATH=/usr/sbin:/usr/bin:/sbin:/bin \
              RECASAOS_PRIVILEGED_MOUNT_TEST=1 \
              "$RUNNER_TEMP/recasaos-publicfiles.test" \
                -test.count=1 \
                -test.run '^(TestPublicVerifierBindAliasDisclosureCannotAuthenticate|TestPinnedPublicRootSurvivesBindMountReplacement|TestPublicRootRejectsNestedBindMount|TestPublicRootAcceptsTmpfsInIsolatedNamespace|TestPublicRootAllowlistedFilesystemCompatibilityMatrix)$' \
                -test.timeout=9m \
                -test.v

  # Run this check for every PR. A skipped job is reported as successful and
  # must not be mistaken for systemd isolation evidence. The job has no
  # secrets or write permission, and its script separately refuses any runner
  # that is not GitHub-hosted.
  isolated-public-files-service:
    name: Isolated public-files systemd service
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Exercise the isolated public-files service
        timeout-minutes: 10
        env:
          RECASAOS_TRUSTED_SYSTEMD_CI: "1"
          RECASAOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RECASAOS_SYSTEMD_TEST_TARGET: github-hosted-ubuntu
        run: .github/scripts/test-public-files-systemd.sh

  # This is a full PID-1 compatibility qualification, not a container parser
  # check. It uses software-emulated QEMU only, gives the guest no host mounts
  # or devices, and is limited to trusted same-repository code. A skipped job
  # is never Debian 11/systemd 247 evidence.
  debian11-systemd247-pid1:
    name: Debian 11 systemd 247 PID1 VM
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]' &&
        (
          github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Install software-emulated VM tools
        timeout-minutes: 5
        shell: bash
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
              ca-certificates \
              cloud-image-utils \
              curl \
              openssh-client \
              qemu-system-x86 \
              qemu-utils

      - name: Exercise exact release candidate under systemd 247 PID 1
        timeout-minutes: 40
        env:
          RECASAOS_DEBIAN11_VM_CI: "1"
          RECASAOS_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RECASAOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: .github/scripts/test-public-files-debian11-vm.sh

  public-files-browser-smoke:
    name: Public-files HTTPS browser smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: false

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install exact browser-test dependencies
        shell: bash
        run: |
          test "$(node --version)" = "v24.18.0"
          npm ci --ignore-scripts --prefix browser-tests
          test "$(
            browser-tests/node_modules/.bin/playwright --version
          )" = "Version 1.62.0"
          npm --prefix browser-tests run test:diagnostics

      - name: Install ephemeral browser dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          browser-tests/node_modules/.bin/playwright install \
            --with-deps \
            chromium \
            firefox \
            webkit
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install --yes --no-install-recommends \
              libnss3-tools \
              openssl \
              unzip \
              zip
          command -v certutil
          command -v openssl
          command -v unzip
          command -v zip

      - name: Exercise browser diagnostic validator negative cases
        env:
          RECASAOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: >-
          bash
          .github/scripts/test-public-files-browser-diagnostics-validator.sh

      - name: Exercise the HTTPS browser boundary
        timeout-minutes: 15
        env:
          RECASAOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: .github/scripts/test-public-files-browser.sh

      - name: Validate credential-safe browser failure diagnostics
        id: browser-diagnostics
        if: >-
          ${{
            failure() &&
            (
              github.event_name != 'pull_request' ||
              (
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.actor != 'dependabot[bot]' &&
                (
                  github.event.pull_request.author_association == 'OWNER' ||
                  github.event.pull_request.author_association == 'MEMBER' ||
                  github.event.pull_request.author_association == 'COLLABORATOR'
                )
              )
            )
          }}
        env:
          RECASAOS_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/recasaos-browser-diagnostics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if bash .github/scripts/validate-public-files-browser-diagnostics.sh \
            "$diagnostics"
          then
            printf 'ready=true\n' >>"$GITHUB_OUTPUT"
          else
            printf 'ready=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Upload credential-safe browser failure diagnostics
        if: >-
          ${{
            always() &&
            steps.browser-diagnostics.outputs.ready == 'true'
          }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recasaos-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recasaos-browser-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

  govulncheck:
    name: Generate and scan reachable Go vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go 1.26.6
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Generate API clients
        run: go generate ./...

      - name: Verify generated API clients are committed
        run: git diff --exit-code -- codegen/

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
